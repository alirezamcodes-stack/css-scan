<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StyleScan Ultra fixture</title>
  <style>
    :root { --brand: #13795b; --space: 1.25rem; }
    body { margin: 0; padding: 48px; background: #f5f8f6; color: #17231d; font: 16px/1.5 Arial, sans-serif; }
    .card { display: flex; flex-direction: column; gap: var(--space); width: 320px; padding: 24px; border: 2px solid var(--brand); border-radius: 12px; background: white; box-shadow: 0 12px 30px rgba(0, 0, 0, .12); }
    .card::before { content: "TEST CARD"; color: var(--brand); font-size: .75rem; font-weight: 700; letter-spacing: .08em; }
    .card button { padding: .75rem 1rem; border: 0; border-radius: 8px; color: white; background: var(--brand); cursor: pointer; }
    .card button:hover { background: #0a4b39; }
    @media (max-width: 600px) { .card { width: auto; padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>StyleScan Ultra test page</h1>
    <article class="card" id="target">
      <h2>Inspectable card</h2>
      <p>This card tests CSS variables, pseudo-elements, media queries, nested HTML and live edits.</p>
      <button id="action" type="button">Click target</button>
      <output id="clicks">0</output>
    </article>
  </main>
  <script>
    let clicks = 0;
    document.getElementById("action").addEventListener("click", () => {
      document.getElementById("clicks").textContent = String(++clicks);
    });
  </script>
</body>
</html>
